name: CI / Release

# lint + test run on every push and PR.
# release is created on version tags — and only if lint + test both pass.
on:
  push:
    branches: ["main"]
    tags:     ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ── lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Babashka (latest)
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/babashka/babashka/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          ARCHIVE="babashka-${VERSION}-linux-amd64-static.tar.gz"
          curl -fsSL "https://github.com/babashka/babashka/releases/download/v${VERSION}/${ARCHIVE}" \
            -o bb.tar.gz
          tar -xzf bb.tar.gz bb && chmod +x bb
          ./bb --version

      - name: Download clj-kondo (latest)
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/clj-kondo/clj-kondo/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          ARCHIVE="clj-kondo-${VERSION}-linux-amd64.zip"
          curl -fsSL \
            "https://github.com/clj-kondo/clj-kondo/releases/download/v${VERSION}/${ARCHIVE}" \
            -o clj-kondo.zip
          unzip -q clj-kondo.zip clj-kondo && chmod +x clj-kondo
          ./clj-kondo --version

      - name: Lint .bb files with clj-kondo
        run: ./clj-kondo --lint eca_bridge.bb eca_workspaces.bb --fail-level error

      - name: Install qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qml6-module-qtqml qt6-declarative-dev

      - name: Lint QML files with qmllint
        continue-on-error: true
        run: |
          qmllint --bare-warnings \
            ChatView.qml ChatWindow.qml Panel.qml Service.qml Session.qml

  # ── test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Babashka (latest)
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/babashka/babashka/releases/latest \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          ARCHIVE="babashka-${VERSION}-linux-amd64-static.tar.gz"
          curl -fsSL "https://github.com/babashka/babashka/releases/download/v${VERSION}/${ARCHIVE}" \
            -o bb.tar.gz
          tar -xzf bb.tar.gz bb && chmod +x bb
          ./bb --version

      - name: Run test suite
        run: |
          export PATH="$PWD:$PATH"
          ./bb test/run_tests.bb

  # ── release ───────────────────────────────────────────────────────────────
  release:
    name: Create release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "omarchy-eca ${{ github.ref_name }}"
          body: |
            ## Installation

            ```bash
            omarchy plugin add https://github.com/${{ github.repository }}.git --enable
            ```

            On first use the plugin automatically downloads and installs `bb` (Babashka)
            and the `eca` server, showing progress in the widget. Nothing needs to be
            pre-installed — the plugin manages its own runtime dependencies.

            ## Manual install / update

            ```bash
            ./install.sh        # first install from a local checkout
            ./install.sh --copy # push changes to an already-enabled plugin
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
